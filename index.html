<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Snake Pro</title>
<meta name="theme-color" content="#000">
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none}
  body{background:#000;overflow:hidden;font-family:'Arial',sans-serif;color:#0ff;display:flex;justify-content:center;align-items:center;height:100vh;}
  canvas{background:radial-gradient(circle at center,#001122,#000);display:block;border:2px solid #0ff;box-shadow:0 0 20px #0ff;}
  #ui{position:absolute;top:20px;width:100%;text-align:center;font-size:24px;text-shadow:0 0 10px #0ff;font-weight:bold;}
  #gameOver{position:absolute;display:none;flex-direction:column;align-items:center;gap:20px;background:rgba(0,0,0,0.8);padding:30px;border:2px solid #0ff;border-radius:10px;box-shadow:0 0 20px #0ff;}
  button{padding:12px 30px;font-size:18px;background:transparent;color:#0ff;border:2px solid #0ff;border-radius:5px;cursor:pointer;box-shadow:0 0 10px #0ff;}
  button:active{background:#0ff;color:#000}
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span></div>
<div id="gameOver">
  <h2>GAME OVER</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <button onclick="restart()">PLAY AGAIN</button>
</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = 20;
canvas.width = gridSize * tileCount;
canvas.height = gridSize * tileCount;

let snake = [{x:10,y:10}];
let food = {x:15,y:15};
let dx = 0, dy = 0;
let score = 0;
let gameRunning = true;

function drawCartoonSnake(x,y,index){
  // Head with eyes
  if(index === 0){
    ctx.fillStyle='#00ff88';
    ctx.beginPath();
    ctx.arc(x*gridSize+10, y*gridSize+10, 9, 0, Math.PI*2);
    ctx.fill();

    // Eyes
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(x*gridSize+7, y*gridSize+8, 2, 0, Math.PI*2);
    ctx.arc(x*gridSize+13, y*gridSize+8, 2, 0, Math.PI*2);
    ctx.fill();
  } else {
    // Body segments
    ctx.fillStyle='#00ff88';
    ctx.beginPath();
    ctx.arc(x*gridSize+10, y*gridSize+10, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=15;ctx.shadowColor='#00ff88';
  }
  ctx.shadowBlur=0;
}

function drawFood(){
  ctx.fillStyle='#ff4444';
  ctx.beginPath();
  ctx.arc(food.x*gridSize+10, food.y*gridSize+10, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=15;ctx.shadowColor='#ff4444';
  ctx.fill();
  ctx.shadowBlur=0;
}

function gameLoop(){
  if(!gameRunning)return;

  // Move snake
  const head = {x:snake[0].x+dx,y:snake[0].y+dy};

  // Check collision
  if(head.x<0||head.x>=tileCount||head.y<0||head.y>=tileCount||snake.some(s=>s.x===head.x&&s.y===head.y)){
    gameRunning=false;
    document.getElementById('gameOver').style.display='flex';
    document.getElementById('finalScore').innerText=score;
    return;
  }

  snake.unshift(head);

  // Check food
  if(head.x===food.x&&head.y===food.y){
    score++;
    document.getElementById('score').innerText=score;
    food={x:Math.floor(Math.random()*tileCount),y:Math.floor(Math.random()*tileCount)};
  } else {
    snake.pop();
  }

  // Draw
  ctx.clearRect(0,0,canvas.width,canvas.height);
  snake.forEach((s,i)=>drawCartoonSnake(s.x,s.y,i));
  drawFood();
}

function restart(){
  snake=[{x:10,y:10}];food={x:15,y:15};dx=0;dy=0;score=0;
  document.getElementById('score').innerText=0;
  document.getElementById('gameOver').style.display='none';
  gameRunning=true;
}

// Controls
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1}
  if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1}
  if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0}
  if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0}
});

// Mobile swipe
let startX=0,startY=0;
canvas.addEventListener('touchstart',e=>{
  startX=e.touches[0].clientX;startY=e.touches[0].clientY;
});
canvas.addEventListener('touchend',e=>{
  let diffX=e.changedTouches[0].clientX-startX;
  let diffY=e.changedTouches[0].clientY-startY;
  if(Math.abs(diffX)>Math.abs(diffY)){
    if(diffX>0&&dx===0){dx=1;dy=0}
    else if(diffX<0&&dx===0){dx=-1;dy=0}
  } else {
    if(diffY>0&&dy===0){dx=0;dy=1}
    else if(diffY<0&&dy===0){dx=0;dy=-1}
  }
});

setInterval(gameLoop,100);
</script>
</body>
</html>
