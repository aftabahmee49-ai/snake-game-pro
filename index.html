<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game Pro - No Wall</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #score { position: absolute; top: 20px; color: white; font-size: 24px; font-family: Arial; }
        canvas { border: 3px solid #0f0; background: #000; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        let snake = [{x: 200, y: 200}];
        let food = {x: 100, y: 100};
        let dx = 0, dy = 0; // Start mein rukega
        let score = 0;
        
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 400, 400);
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x, food.y, 20, 20);
            ctx.fillStyle = '#0f0';
            snake.forEach(part => ctx.fillRect(part.x, part.y, 18, 18));
        }
        
        function move() {
            if (dx === 0 && dy === 0) return; // Swipe karne tak ruka rahega
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Deewar paar karne ka jugaad - No Game Over on Wall Hit
            if (head.x < 0) head.x = 380;
            if (head.x >= 400) head.x = 0;
            if (head.y < 0) head.y = 380;
            if (head.y >= 400) head.y = 0;
            
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = 'Score: ' + score;
                food = {x: Math.floor(Math.random() * 20) * 20, y: Math.floor(Math.random() * 20) * 20};
            } else {
                snake.pop();
            }
            
            // Sirf khud se takrane pe Game Over
            if (snake.slice(1).some(part => part.x === head.x && part.y === head.y)) {
                alert('Game Over! Score: ' + score);
                snake = [{x: 200, y: 200}];
                dx = 0; dy = 0; score = 0;
                scoreEl.textContent = 'Score: 0';
            }
        }
        
        document.addEventListener('touchstart', e => {
            const startX = e.touches[0].clientX;
            const startY = e.touches[0].clientY;
            document.ontouchend = e => {
                const diffX = e.changedTouches[0].clientX - startX;
                const diffY = e.changedTouches[0].clientY - startY;
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (dx === 0) { dx = diffX > 0? 20 : -20; dy = 0; }
                } else {
                    if (dy === 0) { dy = diffY > 0? 20 : -20; dx = 0; }
                }
            };
        });
        
        setInterval(() => { move(); draw(); }, 150);
        draw(); // Pehli baar draw karo
    </script>
</body>
</html>
