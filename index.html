<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Pro Max by Aftab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            text-align: center;
            position: relative;
        }
        #ui {
            color: #0f0;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0f0;
        }
        #score { font-size: 24px; font-weight: bold; }
        #highScore { font-size: 16px; color: #ff0; }
        canvas { 
            border: 4px solid #0f0; 
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 30px #0f0, inset 0 0 20px rgba(0,255,0,0.2);
            border-radius: 10px;
        }
        #controls {
            margin-top: 15px;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            margin: 0 5px;
            cursor: pointer;
            box-shadow: 0 0 15px #0f0;
        }
        button:active { transform: scale(0.95); }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #0f0;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="highScore">High Score: 0</div>
        </div>
        <canvas id="game" width="400" height="400"></canvas>
        <div id="controls">
            <button id="startBtn">START</button>
            <button id="pauseBtn">PAUSE</button>
        </div>
        <div id="gameOver">
            <h2>GAME OVER!</h2>
            <p id="finalScore">Score: 0</p>
            <p id="newHigh" style="color: #ff0; display: none;">NEW HIGH SCORE! 🎉</p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const gameOverEl = document.getElementById('gameOver');
        
        let snake = [{x: 200, y: 200}];
        let food = {x: 100, y: 100};
        let dx = 0, dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameSpeed = 150;
        let gameLoop;
        
        highScoreEl.textContent = 'High Score: ' + highScore;
        
        // Sound Effects - Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(freq, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        function drawGame() {
            // Gradient background effect
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(0, 0, 400, 400);
            
            // Food with glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#f00';
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x, food.y, 20, 20);
            ctx.shadowBlur = 0;
            
            // Snake with gradient
            snake.forEach((part, index) => {
                const gradient = ctx.createLinearGradient(part.x, part.y, part.x + 20, part.y + 20);
                gradient.addColorStop(0, '#0f0');
                gradient.addColorStop(1, '#00f');
                ctx.fillStyle = gradient;
                ctx.fillRect(part.x + 1, part.y + 1, 18, 18);
            });
        }
        
        function moveSnake() {
            if (!gameRunning || gamePaused || (dx === 0 && dy === 0)) return;
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // No Wall - Wrap around
            if (head.x < 0) head.x = 380;
            if (head.x >= 400) head.x = 0;
            if (head.y < 0) head.y = 380;
            if (head.y >= 400) head.y = 0;
            
            snake.unshift(head);
            
            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = 'Score: ' + score;
                playSound(800, 0.1); // Beep sound
                
                // Speed badhao
                if (score % 50 === 0 && gameSpeed > 60) {
                    gameSpeed -= 10;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
                
                // New food
                do {
                    food = {
                        x: Math.floor(Math.random() * 20) * 20,
                        y: Math.floor(Math.random() * 20) * 20
                    };
                } while (snake.some(part => part.x === food.x && part.y === food.y));
                
            } else {
                snake.pop();
            }
            
            // Self collision = Game Over
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }
        }
        
        function gameStep() {
            moveSnake();
            drawGame();
        }
        
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            gamePaused = false;
            dx = 20; dy = 0;
            startBtn.textContent = 'RUNNING';
            gameLoop = setInterval(gameStep, gameSpeed);
        }
        
        function pauseGame() {
            if (!gameRunning) return;
            gamePaused =!gamePaused;
            pauseBtn.textContent = gamePaused? 'RESUME' : 'PAUSE';
        }
        
        function gameOver() {
            playSound(200, 0.5); // Game over sound
            gameRunning = false;
            clearInterval(gameLoop);
            startBtn.textContent = 'START';
            
            document.getElementById('finalScore').textContent = 'Score: ' + score;
            
            // High Score check
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.textContent = 'High Score: ' + highScore;
                document.getElementById('newHigh').style.display = 'block';
            } else {
                document.getElementById('newHigh').style.display = 'none';
            }
            
            gameOverEl.style.display = 'block';
        }
        
        function restartGame() {
            snake = [{x: 200, y: 200}];
            dx = 0; dy = 0; score = 0; gameSpeed = 150;
            scoreEl.textContent = 'Score: 0';
            gameOverEl.style.display = 'none';
            food = {x: 100, y: 100};
            drawGame();
        }
        
        // Controls
        startBtn.onclick = startGame;
        pauseBtn.onclick = pauseGame;
        
        // Mobile Swipe
        document.addEventListener('touchstart', e => {
            const startX = e.touches[0].clientX;
            const startY = e.touches[0].clientY;
            document.ontouchend = e => {
                if (!gameRunning) startGame();
                const diffX = e.changedTouches[0].clientX - startX;
                const diffY = e.changedTouches[0].clientY - startY;
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (dx === 0) { dx = diffX > 0? 20 : -20; dy = 0; }
                } else {
                    if (dy === 0) { dy = diffY > 0? 20 : -20; dx = 0; }
                }
            };
        });
        
        // Keyboard
        document.addEventListener('keydown', e => {
            if (!gameRunning && e.code === 'Space') startGame();
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -20; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 20; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -20; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = 20; dy = 0; }
        });
        
        drawGame();
    <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</body>
</html>
