<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game - No Walls</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial; 
            overflow: hidden;
        }
        #score { 
            position: absolute; 
            top: 20px; 
            color: #0f0; 
            font-size: 28px; 
            font-weight: bold;
        }
        #info {
            position: absolute;
            bottom: 30px;
            color: #888;
            font-size: 16px;
        }
        canvas { 
            border: 3px solid #0f0; 
            background: #000;
            box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="info">Swipe karke chalao 👆</div>
    
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const infoEl = document.getElementById('info');
        
        let snake = [{x: 200, y: 200}];
        let food = {x: 100, y: 100};
        let dx = 0, dy = 0; // Start mein rukega
        let score = 0;
        let gameStarted = false;
        
        function drawGame() {
            // Background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 400, 400);
            
            // Food - Laal dabba
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x, food.y, 20, 20);
            
            // Snake - Hara dabba
            ctx.fillStyle = '#0f0';
            snake.forEach((part, index) => {
                ctx.fillRect(part.x + 1, part.y + 1, 18, 18);
            });
        }
        
        function moveSnake() {
            if (dx === 0 && dy === 0) return; // Jab tak swipe na ho, ruka rahe
            
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // DEEWAR KA ILAAJ - Screen ke paar nikal jao
            if (head.x < 0) head.x = 380; // Left se nikal ke Right se aao
            if (head.x >= 400) head.x = 0; // Right se nikal ke Left se aao 
            if (head.y < 0) head.y = 380; // Upar se nikal ke Neeche se aao
            if (head.y >= 400) head.y = 0; // Neeche se nikal ke Upar se aao
            
            snake.unshift(head);
            
            // Khana khaya?
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = 'Score: ' + score;
                // Naya khana random jagah
                food = {
                    x: Math.floor(Math.random() * 20) * 20, 
                    y: Math.floor(Math.random() * 20) * 20
                };
            } else {
                snake.pop(); // Pooch kaat do
            }
            
            // Khud ko kaata? Tabhi Game Over
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    alert('Game Over! Score: ' + score + '\n\nShahbaz ko hara diya? 😎');
                    // Reset game
                    snake = [{x: 200, y: 200}];
                    dx = 0; dy = 0; score = 0;
                    scoreEl.textContent = 'Score: 0';
                    infoEl.style.display = 'block';
                    gameStarted = false;
                    return;
                }
            }
        }
        
        // MOBILE SWIPE CONTROL
        document.addEventListener('touchstart', e => {
            const touchStartX = e.touches[0].clientX;
            const touchStartY = e.touches[0].clientY;
            
            document.ontouchend = e => {
                if (!gameStarted) {
                    infoEl.style.display = 'none';
                    gameStarted = true;
                }
                
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const diffX = touchEndX - touchStartX;
                const diffY = touchEndY - touchStartY;
                
                // Swipe direction check
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // Left-Right swipe
                    if (dx === 0) { // Ulta na mude
                        dx = diffX > 0? 20 : -20;
                        dy = 0;
                    }
                } else {
                    // Up-Down swipe 
                    if (dy === 0) { // Ulta na mude
                        dy = diffY > 0? 20 : -20;
                        dx = 0;
                    }
                }
            };
        });
        
        // PC KE LIYE ARROW KEYS
        document.addEventListener('keydown', e => {
            if (!gameStarted) {
                infoEl.style.display = 'none';
                gameStarted = true;
            }
            if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -20; }
            if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 20; }
            if (e.key === 'ArrowLeft' && dx === 0) { dx = -20; dy = 0; }
            if (e.key === 'ArrowRight' && dx === 0) { dx = 20; dy = 0; }
        });
        
        // Game Loop - 150ms mein ek baar chale
        setInterval(() => {
            moveSnake();
            drawGame();
        }, 150);
        
        drawGame(); // Pehli baar screen draw karo
    </script>
</body>
</html>
