<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game Pro</title>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 2px solid lime; }
    </style>
</head>
<body>
    <canvas id="game" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let snake = [{x: 200, y: 200}];
        let food = {x: 100, y: 100};
        let dx = 20, dy = 0;
        let score = 0;
        
        document.addEventListener('touchstart', e => {
            let touch = e.touches[0];
            let startX = touch.clientX, startY = touch.clientY;
            document.ontouchend = ev => {
                let endX = ev.changedTouches[0].clientX;
                let endY = ev.changedTouches[0].clientY;
                if(Math.abs(endX-startX) > Math.abs(endY-startY)) {
                    dx = endX > startX? 20 : -20; dy = 0;
                } else {
                    dy = endY > startY? 20 : -20; dx = 0;
                }
            }
        });
        
        function gameLoop() {
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score += 10;
                food = {x: Math.floor(Math.random()*20)*20, y: Math.floor(Math.random()*20)*20};
            } else {
                snake.pop();
            }
            if(head.x<0||head.x>380||head.y<0||head.y>380||snake.slice(1).some(s=>s.x===head.x&&s.y===head.y)) {
                alert('Game Over! Score: '+score);
                snake = [{x: 200, y: 200}]; dx = 20; dy = 0; score = 0;
            }
            ctx.fillStyle = 'black'; ctx.fillRect(0,0,400,400);
            ctx.fillStyle = 'red'; ctx.fillRect(food.x, food.y, 20, 20);
            ctx.fillStyle = 'lime'; snake.forEach(s => ctx.fillRect(s.x, s.y, 20, 20));
            ctx.fillStyle = 'white'; ctx.fillText('Score: '+score, 10, 20);
        }
        setInterval(gameLoop, 150);
    </script>
</body>
</html>
